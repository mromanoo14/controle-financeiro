# Testa o backend e o app v2 e gera os executáveis (APK Android e Windows).
# Os arquivos gerados ficam em: GitHub > Actions > (execução) > Artifacts.
#
# Para apontar o app para a sua API publicada, crie a variável do repositório
# API_URL em Settings > Secrets and variables > Actions > Variables.
name: v2

on:
  push:
    paths: ["v2/**", ".github/workflows/v2.yml"]
  pull_request:
    paths: ["v2/**", ".github/workflows/v2.yml"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  backend:
    strategy:
      matrix:
        python: ["3.12", "3.15"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: financeiro
          POSTGRES_PASSWORD: financeiro
          POSTGRES_DB: cf_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: v2/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Testes (SQLite)
        run: pytest -q
      - name: Testes (PostgreSQL)
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://financeiro:financeiro@localhost:5432/cf_test
      - name: Migrações batem com os modelos
        run: alembic upgrade head && alembic check
        env:
          DATABASE_URL: postgresql+psycopg://financeiro:financeiro@localhost:5432/cf_test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Gerar APK
        run: flutter build apk --release --dart-define=API_URL=${{ vars.API_URL || 'http://10.0.2.2:8000' }}
      - uses: actions/upload-artifact@v4
        with:
          name: controle-financeiro-android
          path: v2/app/build/app/outputs/flutter-apk/app-release.apk

  windows:
    needs: app
    runs-on: windows-latest
    defaults:
      run:
        working-directory: v2/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Gerar executável Windows
        run: flutter build windows --release --dart-define=API_URL=${{ vars.API_URL || 'http://localhost:8000' }}
      - uses: actions/upload-artifact@v4
        with:
          name: controle-financeiro-windows
          path: v2/app/build/windows/x64/runner/Release/

# Publicação no Render (https://render.com) via Blueprint.
# No painel do Render: New > Blueprint > escolha este repositório.
#
# Começa nos planos gratuitos. Limites do plano grátis:
#  - a API "dorme" após 15 min sem uso (a primeira abertura demora ~1 min);
#  - o banco gratuito expira 30 dias após ser criado.
# Para uso real, troque `plan: free` por `starter` (API) e `basic-256mb` (banco).
services:
  - type: web
    name: controle-financeiro-api
    runtime: docker
    plan: free
    region: virginia
    branch: main
    dockerContext: ./v2/backend
    dockerfilePath: ./v2/backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: controle-financeiro-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Endereço do app web publicado no GitHub Pages.
      - key: CORS_ORIGINS
        value: '["https://mromanoo14.github.io"]'
      - key: OPEN_FINANCE_PROVIDER
        value: mock
      - key: BILLING_PROVIDER
        value: mock

databases:
  - name: controle-financeiro-db
    plan: free
    region: virginia
    databaseName: controle_financeiro
    user: financeiro
